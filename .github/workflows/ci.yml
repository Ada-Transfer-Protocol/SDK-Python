name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install cryptography websocket-client
      - run: python -m py_compile src/adatp/*.py
      - run: PYTHONPATH=src python -c "import adatp.client, adatp.crypto, adatp.protocol; print('import ok')"
