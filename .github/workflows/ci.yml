name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install cryptography websocket-client
      - run: python -m py_compile src/adatp/*.py
      - run: PYTHONPATH=src python -c "import adatp.client, adatp.crypto, adatp.protocol, adatp.handshake_v2; print('import ok')"
      # v2 authenticated-handshake conformance (golden-vector replay; no server).
      - run: python test/conformance_v2.py
